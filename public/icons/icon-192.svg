<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151F30" />
      <stop offset="100%" stop-color="#080D18" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7357F5" />
      <stop offset="50%" stop-color="#5b40e6" />
      <stop offset="100%" stop-color="#3984FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="192" height="192" rx="42" fill="url(#bg)" stroke="#7357F5" stroke-opacity="0.3" stroke-width="3" />

  <!-- Waveform / Equalizer Bars -->
  <g fill="url(#accent)" filter="url(#glow)">
    <rect x="36" y="86" width="10" height="20" rx="5" />
    <rect x="52" y="68" width="10" height="56" rx="5" />
    <rect x="68" y="48" width="10" height="96" rx="5" />
    <rect x="84" y="34" width="10" height="124" rx="5" />
    <rect x="100" y="56" width="10" height="80" rx="5" />
    <rect x="116" y="74" width="10" height="44" rx="5" />
    <rect x="132" y="84" width="10" height="24" rx="5" />
  </g>

  <!-- AI Sparkle Icon -->
  <path d="M148 42 L152 54 L164 58 L152 62 L148 74 L144 62 L132 58 L144 54 Z" fill="#16C784" />
</svg>

