<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151F30" />
      <stop offset="100%" stop-color="#080D18" />
    </linearGradient>
    <linearGradient id="accent512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7357F5" />
      <stop offset="50%" stop-color="#5b40e6" />
      <stop offset="100%" stop-color="#3984FF" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg512)" stroke="#7357F5" stroke-opacity="0.35" stroke-width="6" />

  <!-- Waveform / Equalizer Bars -->
  <g fill="url(#accent512)" filter="url(#glow512)">
    <rect x="96" y="230" width="28" height="52" rx="14" />
    <rect x="140" y="180" width="28" height="152" rx="14" />
    <rect x="184" y="128" width="28" height="256" rx="14" />
    <rect x="228" y="90" width="28" height="332" rx="14" />
    <rect x="272" y="148" width="28" height="216" rx="14" />
    <rect x="316" y="198" width="28" height="116" rx="14" />
    <rect x="360" y="226" width="28" height="60" rx="14" />
  </g>

  <!-- AI Sparkle Icon -->
  <path d="M400 110 L410 142 L442 152 L410 162 L400 194 L390 162 L358 152 L390 142 Z" fill="#16C784" />
</svg>

